[package]
name = "ppc_rs"
version = "0.2.0"
edition = "2021"
description = "Rust engine for the ppc-forecaster continual-learning network"
license = "MIT"
publish = false

[lib]
name = "ppc_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
numpy = "0.25"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
