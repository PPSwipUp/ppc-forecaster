[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ppc-forecaster"
version = "0.2.0"
description = "A forecaster that keeps learning as data arrives: a plastic recurrent network (Rust) with honest built-in baselines"
readme = "PACKAGE_README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.3"]
keywords = ["forecasting", "online learning", "continual learning", "time series", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ppc = "ppc.cli:main"

[tool.maturin]
manifest-path = "ppc_rs/Cargo.toml"
module-name = "ppc.ppc_rs"
python-packages = ["ppc"]
python-source = "."
# a locally built extension (ppc_rs/build.sh) and research-only modules must not ship
include = [{ path = "LICENSE", format = "sdist" }]
exclude = ["ppc/*.so", "ppc/*.pyd", "ppc/__pycache__/**", "ppc/fastweights.py"]
